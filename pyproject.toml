[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-goal-decomposer"
version = "0.1.0"
description = "Deterministic decomposition of explicit goal trees"
requires-python = ">=3.10"

[project.scripts]
kgd = "koml_goal_decomposer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
